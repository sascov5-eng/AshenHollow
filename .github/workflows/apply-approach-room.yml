name: Apply Approach Room Rebuild

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Approach rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_approach_room.py

      - name: Verify Approach contract before commit
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/ApproachRoomLayoutTests.swift \
            Sources/V24LevelRebuildV2.swift \
            Sources/RoomController.swift \
            Sources/EnemyArchetype.swift \
            Sources/DemoProgression.swift \
            -o /tmp/ApproachRoomLayoutTests
          /tmp/ApproachRoomLayoutTests

      - name: Commit rebuilt room
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Sources/V24LevelRebuildV2.swift; then
            echo "Approach room already integrated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Sources/V24LevelRebuildV2.swift
            git commit -m "feat: rebuild Approach room from tile-based layout principles"
            git push origin HEAD:main
          fi
