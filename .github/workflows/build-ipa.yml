name: Build Ashen Hollow IPA

on:
  push:
    branches:
      - main
      - feature/v1.4-implementation
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore player animation assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Resources/PlayerAnimations
          mkdir -p Resources
          cat AssetData/player_animations.b64.0 AssetData/player_animations.b64.1 AssetData/player_animations.b64.2 AssetData/player_animations.b64.3 | base64 -D -o /tmp/player_animations.zip
          unzip -qo /tmp/player_animations.zip -d Resources
      - name: Validate player animation assets
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/validate-player-animation-assets.sh
      - name: Run legacy blockout logic tests
        shell: bash
        run: |
          set -euo pipefail
          bash Tests/run-blockout-tests.sh
      - name: Apply v1.2 large world integration to legacy scene
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply-large-world-v1.2.py
          grep -q 'LargeWorldLayout.blockout' Sources/GameScene.swift
          grep -q 'cameraController.update' Sources/GameScene.swift
      - name: Apply v1.1 player visual scale to legacy scene
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply-player-scale-v1.1.py
          grep -q 'sprite.size = CGSize(width: 480, height: 480)' Sources/GameScene.swift
      - name: Apply v1.3 feedback fixes to legacy scene
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply-v1.3-feedback-fixes.py
      - name: Run v1.3 camera and control regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/test-v13-integration.py
      - name: Run v1.4 logic tests
        shell: bash
        run: |
          set -euo pipefail
          bash Tests/run-v14-logic-tests.sh
      - name: Run v1.4 integration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/test-v14-integration.py
      - name: Validate v1.4 release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<key>CFBundleShortVersionString</key><string>1.4</string>' Info.plist
          grep -q 'v1.4 • PERFECTED TEST LOCATION' Sources/GameView.swift
          grep -q '<key>CFBundleIdentifier</key><string>app.ashenhollow.prototype</string>' Info.plist
          grep -q '<key>CFBundleVersion</key><string>2</string>' Info.plist
      - name: Prepare app bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/Payload/AshenHollow.app
      - name: Compile Ashen Hollow
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP="build/Payload/AshenHollow.app"
          xcrun swiftc -parse-as-library -target arm64-apple-ios15.0 -sdk "$SDK" -O -framework Foundation -framework SwiftUI -framework UIKit -framework SpriteKit Sources/*.swift -o "$APP/AshenHollow"
          chmod +x "$APP/AshenHollow"
          cp Info.plist "$APP/Info.plist"
          if [ -d Resources ]; then
            cp -R Resources/. "$APP/"
          fi
          cat SpriteData/player_run.b64.0 SpriteData/player_run.b64.1 SpriteData/player_run.b64.2 SpriteData/player_run.b64.3 | base64 -D > "$APP/player_run.png"
          test -f "$APP/AshenHollow"
          test -f "$APP/Info.plist"
          test -f "$APP/PlayerAnimations/Idle.png"
          test -f "$APP/PlayerAnimations/Run.png"
          test -f "$APP/PlayerAnimations/Jump.png"
          test -f "$APP/PlayerAnimations/Fall.png"
          test -f "$APP/PlayerAnimations/Dash.png"
          test -f "$APP/PlayerAnimations/Attack1.png"
          test -f "$APP/PlayerAnimations/Attack2.png"
          test -f "$APP/PlayerAnimations/Hurt.png"
          test -f "$APP/PlayerAnimations/Death.png"
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -qry AshenHollow-unsigned.ipa Payload
          test -f AshenHollow-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshenHollow-unsigned-ipa
          path: build/AshenHollow-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
