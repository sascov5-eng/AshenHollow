name: V24 Full Route Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  route-validation:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and run TMX parser tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/TMXLevelLoaderTests.swift \
            Sources/TMXRoomSchema.swift \
            Sources/TMXLevelLoader.swift \
            Sources/RoomController.swift \
            Sources/EnemyArchetype.swift \
            Sources/DemoProgression.swift \
            -o /tmp/TMXLevelLoaderTests
          /tmp/TMXLevelLoaderTests

      - name: Compile and run TMX Approach parity tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/TMXApproachParityTests.swift \
            Sources/TMXRoomSchema.swift \
            Sources/TMXLevelLoader.swift \
            Sources/V24LevelRebuildV2.swift \
            Sources/V24RouteValidator.swift \
            Sources/V24MandatoryRoute.swift \
            Sources/V24EncounterSafetyValidator.swift \
            Sources/TraversalSafetyValidator.swift \
            Sources/PlayerMovementTuning.swift \
            Sources/RoomController.swift \
            Sources/EnemyArchetype.swift \
            Sources/DemoProgression.swift \
            -o /tmp/TMXApproachParityTests
          /tmp/TMXApproachParityTests

      - name: Compile and run Approach room layout tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/ApproachRoomLayoutTests.swift \
            Sources/V24LevelRebuildV2.swift \
            Sources/TMXRoomSchema.swift \
            Sources/TMXLevelLoader.swift \
            Sources/RoomController.swift \
            Sources/EnemyArchetype.swift \
            Sources/DemoProgression.swift \
            -o /tmp/ApproachRoomLayoutTests
          /tmp/ApproachRoomLayoutTests

      - name: Compile and run full-route validator tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/V24FullRouteValidationTests.swift \
            Sources/V24RouteValidator.swift \
            Sources/V24MandatoryRoute.swift \
            Sources/V24LevelRebuildV2.swift \
            Sources/TMXRoomSchema.swift \
            Sources/TMXLevelLoader.swift \
            Sources/TraversalSafetyValidator.swift \
            Sources/PlayerMovementTuning.swift \
            Sources/RoomController.swift \
            Sources/EnemyArchetype.swift \
            Sources/DemoProgression.swift \
            -o /tmp/V24FullRouteValidationTests
          /tmp/V24FullRouteValidationTests

      - name: Compile and run gameplay framing tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/GameplayFramingTests.swift \
            Sources/GameplayFraming.swift \
            Sources/HUDControlLayout.swift \
            -o /tmp/GameplayFramingTests
          /tmp/GameplayFramingTests

      - name: Compile and run encounter safety tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/V24EncounterSafetyValidatorTests.swift \
            Sources/V24EncounterSafetyValidator.swift \
            Sources/V24MandatoryRoute.swift \
            Sources/V24LevelRebuildV2.swift \
            Sources/TMXRoomSchema.swift \
            Sources/TMXLevelLoader.swift \
            Sources/PlayerMovementTuning.swift \
            Sources/RoomController.swift \
            Sources/EnemyArchetype.swift \
            Sources/DemoProgression.swift \
            -o /tmp/V24EncounterSafetyValidatorTests
          /tmp/V24EncounterSafetyValidatorTests
